# Ablation A2, control condition: decentralized (IPPO-style) recurrent critic.
#
# Identical to a2_centralized.yaml in every field except `critic_mode` and the
# resulting critic input width. That is the point of the ablation: one
# difference, everything else held fixed.

condition: a2_decentralized
critic_mode: decentralized

actor_observation_dim: 692
critic_observation_dim: 692

actor_parameters: 956617
critic_parameters: 940169

# Inherited unchanged from Phase 9.
architecture: gru
environment_count: 16
rollout_length: 128        # base budget; the G6 drain runs past it
total_updates: 250
chunk_length: 16
training_opponent: basic
bc_checkpoint: checkpoints/phase9_bc_gru.pt
independent_seeds: [0, 1, 2]

update_boundary: complete-deal G6 drain
check_epoch_zero: true
epoch_zero_tolerance: 0.0001

evaluation:
  every_updates: 50
  paired_deals: 150
  opponents: [random, basic, strong]
  development_seed_range: [4000000, 4010000]
  final_held_out_seed: 20250910
  checkpoint_selection: pre-registered final update, by design, never by score
